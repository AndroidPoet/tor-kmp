[package]
name = "torkmp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# No "rlib": with it in the list, LTO does not apply to the staticlib (104 MB vs 15 MB).
crate-type = ["staticlib", "cdylib"]

[dependencies]
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static-sqlite", "bridge-client", "pt-client"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
futures = "0.3"
# Arti's TLS needs one crypto provider; ring cross-compiles without cmake.
# Build xz from source so no target needs a system liblzma (iOS/Android have none).
liblzma-sys = { version = "0.4", default-features = false, features = ["static"] }
# libc 0.2.190 made proc_fdinfo macOS-only, but sysinfo 0.38 (via tor-memquota)
# still uses it on iOS. Hold libc back until tor-memquota moves to sysinfo 0.39.
libc = "=0.2.189"
jni = { version = "0.21", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# TLS over Tor streams for torkmp_connect_tls; same rustls Arti already links.
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Bridge and pluggable-transport settings arrive from Kotlin as one JSON document.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opt-in diagnostics: TORKMP_LOG=<level> prints Arti's tracing output to stderr.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# OS randomness for generated SOCKS passwords and isolation keys.
getrandom = "0.3"

[features]
# JNI exports for the JVM and Android builds; Kotlin/Native calls the C ABI directly.
jni = ["dep:jni"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Apple targets strip at link time instead (.cargo/config.toml).
strip = false
panic = "abort"
