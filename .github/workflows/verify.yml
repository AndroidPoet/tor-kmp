name: Verify platforms

# Runs the live test suites on every platform GitHub can host: iOS simulator,
# Android emulator, Linux and Windows. Manual only: each run builds the Rust core
# and talks to the real Tor network for several minutes. The maintainer runs it
# before a release and links the run from the README.
on:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ios-simulator:
    name: iOS simulator (tor, tor-ktor)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
      - name: Live tests on the simulator
        run: ./gradlew :tor:iosSimulatorArm64Test :tor-ktor:iosSimulatorArm64Test -Ptor.simulator="iPhone 16"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: '**/build/test-results/**/*.xml'

  android-emulator:
    name: Android emulator (tor, tor-ktor, tor-okhttp, tor-lyrebird)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Live tests on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: '**/build/outputs/androidTest-results/**/*.xml'

  linux:
    name: Linux x64 (tor, tor-ktor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Live tests (Kotlin/Native linuxX64)
        run: ./gradlew :tor:linuxX64Test :tor-ktor:linuxX64Test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-results
          path: '**/build/test-results/**/*.xml'

  windows:
    name: Windows x64 (tor, tor-ktor)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Live tests (Kotlin/Native mingwX64)
        shell: bash
        run: ./gradlew :tor:mingwX64Test :tor-ktor:mingwX64Test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: '**/build/test-results/**/*.xml'
