name: Verify platforms

# Runs the live test suites on every platform GitHub can host: iOS simulator,
# Android emulator, Linux and Windows. Manual only: each run builds the Rust core
# and talks to the real Tor network for several minutes. The maintainer runs it
# before a release and links the run from the README.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job: ios, android, linux or windows (empty = all)"
        required: false
        default: ""
      log:
        description: "TORKMP_LOG level for the Windows steps: error, warn, info, debug or trace"
        required: false
        default: "debug"

# Keyed by the `only` input too, so `-f only=linux` and `-f only=windows` run
# side by side instead of the second cancelling the first.
concurrency:
  group: verify-${{ github.ref }}-${{ inputs.only }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ios-simulator:
    name: iOS simulator (tor, tor-ktor)
    if: inputs.only == '' || inputs.only == 'ios'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
      - name: Live tests on the simulator
        run: ./gradlew :tor:iosSimulatorArm64Test :tor-ktor:iosSimulatorArm64Test -Ptor.simulator="iPhone 16"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-simulator-results
          path: '**/build/test-results/**/*.xml'

  android-emulator:
    name: Android emulator (tor, tor-ktor, tor-okhttp, tor-lyrebird)
    if: inputs.only == '' || inputs.only == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" > /dev/null
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Live tests on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-results
          path: '**/build/outputs/androidTest-results/**/*.xml'

  linux:
    name: Linux x64 (tor, tor-ktor)
    if: inputs.only == '' || inputs.only == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - name: Live tests (Kotlin/Native linuxX64)
        run: ./gradlew :tor:linuxX64Test :tor-ktor:linuxX64Test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-results
          path: '**/build/test-results/**/*.xml'

  windows:
    name: Windows x64 (tor, tor-ktor)
    if: inputs.only == '' || inputs.only == 'windows'
    runs-on: windows-latest
    # A cold Rust build of Arti on this runner alone takes most of an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      # The Windows gate: the Rust core as torkmp.dll inside a JVM, which is what
      # the published jar ships.
      - name: JVM live test (torkmp.dll)
        shell: bash
        env:
          TORKMP_LOG: ${{ inputs.log }}
        run: |
          set +e
          timeout 1200 ./gradlew :tor:jvmTest --tests '*TorLiveTest.test_connectTls_toCheckTorProject*' --info 2>&1 \
            | grep -vE "^(Caching disabled|Skipping|Resolve mutations|Task .* is not up-to-date|Starting process|Successfully started|file or directory|Watching|Received|Build cache|Executing|Transforming|Downloading|Download)"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          report=tor/build/test-results/jvmTest/TEST-io.github.androidpoet.tor.TorLiveTest.xml
          test -f "$report"
          grep -q 'tests="1"' "$report" && ! grep -q "<failure" "$report"
      - name: Link the test binaries
        shell: bash
        run: ./gradlew :tor:linkDebugTestMingwX64 :tor-ktor:linkDebugTestMingwX64
      # The binaries run directly so every test's output streams into the log
      # and a hang is pinned to one test by the per-class timeout, rather than
      # the Gradle test task sitting silent until the job limit.
      - name: Unit tests (no network)
        shell: bash
        run: |
          timeout 120 tor/build/bin/mingwX64/debugTest/test.exe --ktest_logger=SIMPLE \
            --ktest_filter='io.github.androidpoet.tor.ValueSemanticsTest.*:io.github.androidpoet.tor.internal.NativeHandleTest.*'
      - name: Live tests, tor (mingwX64)
        shell: bash
        env:
          TORKMP_LOG: ${{ inputs.log }}
        run: |
          timeout 600 tor/build/bin/mingwX64/debugTest/test.exe --ktest_logger=SIMPLE \
            --ktest_filter='io.github.androidpoet.tor.TorLiveTest.*'
      - name: Live tests, tor-ktor (mingwX64)
        shell: bash
        env:
          TORKMP_LOG: ${{ inputs.log }}
        run: timeout 600 tor-ktor/build/bin/mingwX64/debugTest/test.exe --ktest_logger=SIMPLE
