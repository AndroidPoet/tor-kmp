name: Build

# Runs on pull requests and by hand. Every run compiles the Rust core, so it is
# not triggered on each push to main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # tor-lyrebird builds the Go pluggable-transport client from source.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      # The compiler and its targets come from native/rust-toolchain.toml; the
      # cross tools are pinned here. Bump all of them together, with Arti.
      - name: Install Rust toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-zigbuild --version 0.24.0 --locked
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - name: Formatting (spotlessCheck)
        run: ./gradlew spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      # Compiles every target's klib ABI, which builds the Rust core for each one.
      - name: Binary compatibility (apiCheck)
        run: ./gradlew apiCheck -Ptor.rust.prune=true

      # Live tests against the Tor network; the runner has internet access.
      - name: JVM tests
        run: ./gradlew :tor:jvmTest
