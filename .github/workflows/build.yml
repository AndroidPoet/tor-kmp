name: Build

# Runs on pull requests and by hand. Every run compiles the Rust core, so it is
# not triggered on each push to main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchains
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios \
            aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu
          brew install zig
          cargo install cargo-zigbuild cargo-ndk --locked

      - name: Formatting (spotlessCheck)
        run: ./gradlew spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      # Compiles every target's klib ABI, which builds the Rust core for each one.
      - name: Binary compatibility (apiCheck)
        run: ./gradlew apiCheck -Ptor.rust.prune=true

      # Live tests against the Tor network; the runner has internet access.
      - name: JVM tests
        run: ./gradlew :tor:jvmTest
