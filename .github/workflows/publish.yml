name: Publish

on:
  release:
    # Fire only when a release is actually published, not on drafts/prereleases.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # One macOS runner builds the Rust core for every target: cargo for Apple,
      # cargo-zigbuild for Linux/Windows, cargo-ndk for Android.
      # The compiler and its targets come from native/rust-toolchain.toml; the
      # cross tools are pinned here. Bump all of them together, with Arti.
      - name: Install Rust toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          (cd native && rustup show)
          cargo install cargo-zigbuild --version 0.24.0 --locked
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Verify build before publishing
        run: ./gradlew apiCheck detekt

      # --no-configuration-cache: the vanniktech publish tasks are not yet
      # configuration-cache compatible; remove once they are.
      - name: Publish and release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -Ptor.jvm.allPlatforms=true -Ptor.rust.prune=true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
